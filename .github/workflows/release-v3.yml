name: Release Strategy Core V3

on:
  push:
    tags:
      - "strategy-core-v3-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      STRATEGY_CORE_RELEASE_RUNNER_IMAGE: ubuntu-24.04
    steps:
      - name: Require external repository immutability attestations
        env:
          IMMUTABLE_RELEASES_ATTESTATION: ${{ vars.STRATEGY_CORE_V3_IMMUTABLE_RELEASES_ATTESTATION }}
          PROTECTED_TAG_ATTESTATION: ${{ vars.STRATEGY_CORE_V3_PROTECTED_TAG_ATTESTATION }}
        run: |
          test "$IMMUTABLE_RELEASES_ATTESTATION" = "immutable-releases-enabled"
          test "$PROTECTED_TAG_ATTESTATION" = "strategy-core-v3-tags-update-delete-blocked-no-bypass"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.9.28"
          python-version: "3.12.12"

      - name: Install exact Rust release toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt

      - name: Require the declared annotated release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "strategy-core-v3-v0.1.0"
          RELEASE_TAG_REF="refs/release-tags/$RELEASE_TAG"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:$RELEASE_TAG_REF"
          test "$(git cat-file -t "$RELEASE_TAG_REF")" = tag
          test "$(git rev-parse "$RELEASE_TAG_REF^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify reproducible artifacts and clean pinned consumers
        run: uv run --frozen python scripts/build_v3_release.py --check --check-toolchains

      - name: Verify release contract tests
        run: uv run --frozen pytest tests/v3/test_release_manifest.py -q

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/v3/README.md \
            release/v3/artifacts/* \
            release/v3/conformance/* \
            release/v3/manifest.json \
            release/v3/toolchains.json \
            release/v3/consumer-lock.json \
            release/v3/rust-consumer.Cargo.lock \
            release/v3/SHA256SUMS \
            --verify-tag \
            --title "Strategy Core V3 0.1.0" \
            --notes-file docs/releases/strategy-core-v3.md
