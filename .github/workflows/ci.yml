name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Legacy-free gate
        run: scripts/legacy-free-check.sh

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Cargo format
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check

      - name: Cargo clippy
        run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings

      - name: Cargo test (kernel, V3 and V6 conformance)
        run: cargo test --manifest-path native/Cargo.toml --workspace --locked

      - name: Cargo test (strategy-core-v3 kernel host)
        run: cargo test --manifest-path native/Cargo.toml -p strategy-core-v3 --all-features --locked
