[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strategy-core"
version = "0.1.0"
description = "Shared strategy contract package for trader and backtester runtimes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "tzdata>=2025.2",
]

[tool.hatch.build.targets.wheel]
packages = ["strategy_core"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
