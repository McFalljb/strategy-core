[package]
name = "strategy-core-v3"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pure, bounded, runtime-neutral Strategy Core V3 semantics"
license = "MIT"
repository = "https://github.com/McFalljb/strategy-core"
documentation = "https://docs.rs/strategy-core-v3"

[features]
# Core-owned kernel projection and transaction runner for `strategy-core-kernel` consumers.
kernel = ["dep:chrono", "dep:serde_json"]

[dependencies]
bincode = { version = "=2.0.1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = "=0.10.9"
strategy-core-kernel = { path = "../strategy_core_kernel" }
unicode-normalization = "=0.1.25"

[dev-dependencies]
serde_json = "=1.0.150"
