[package]
name = "strategy-core-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared native strategy kernel contract for strategy-core runtimes"
license = "MIT"

[dependencies]
bincode = { version = "=2.0.1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
